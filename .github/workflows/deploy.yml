name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check backend
        run: npm run typecheck --workspace=backend

      - name: Type check frontend
        run: npm run typecheck --workspace=frontend

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          DEPLOY_URL=$(vercel --prod --yes --cwd frontend 2>&1 | grep -o 'https://shared-todo-[^ ]*\.vercel\.app' | head -1)
          vercel alias "$DEPLOY_URL" shared-todo-maor765.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_KFtpDtY7AWW1JbEuxiQ28OAQ
          VERCEL_PROJECT_ID: prj_NFNKaaMTWau4vyTCHJpxfYZ5Weke
